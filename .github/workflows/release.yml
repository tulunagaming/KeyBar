name: Release

# Ein Tag wie "v1.0.1" loest den Build aus. Der BigWigs-Packager baut das
# Zip aus dem Repo, haengt es an das GitHub-Release und laedt es zu Wago hoch.
on:
  push:
    tags:
      - '**'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
